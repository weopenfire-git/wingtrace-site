# 航迹 WingTrace 站点配置（容器内路径 /etc/nginx/conf.d/default.conf）
#
# 站点只有一个自包含 HTML 文件，所有图片与图标都以 data: 内联，页面不再发起任何外部请求，
# 因此这里只做：静态托管 + 压缩 + 基础安全响应头，不配置任何反向代理或上游。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # 静态文本压缩（单文件站点主要就是这一个 HTML）
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/html text/css application/javascript image/svg+xml;

    # 基础安全响应头。
    # 注意：nginx 的 add_header 不会向下继承到自身也写了 add_header 的 location，
    # 所以除 location / 之外不要再新增带 add_header 的 location，除非同步补上这几行。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # 页面使用内联 <style>/<script>，图片与图标为 data: URI，且没有任何外部域名请求。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 若希望每次访问都拿最新版本（不缓存 HTML），把上面的 location / 替换为下面两段：
#
#     location = / {
#         expires -1;          # 等价于 Cache-Control: no-cache
#     }
#     location = /index.html {
#         expires -1;
#     }
#
# expires 不是 add_header，不会影响上面的安全响应头继承。